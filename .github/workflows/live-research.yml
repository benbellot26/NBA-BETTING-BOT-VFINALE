name: Pulsar NBA Live Research
concurrency:
  group: nba-runtime-data
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: YYYY-MM-DD (optional)
        required: false
  schedule:
    - cron: '*/20 17-23 * * *'
    - cron: '*/20 0-6 * * *'
jobs:
  live:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Hydrate runtime evidence
        run: |
          git fetch origin runtime-data || true
          if git show-ref --verify --quiet refs/remotes/origin/runtime-data; then
            git archive origin/runtime-data runtime 2>/dev/null | tar -x || true
          fi
      - name: Run live research and close capture
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "ODDS_API_KEY is not configured; live research skipped."
            exit 0
          fi
          DATE_ARG=""
          if [ -n "$TARGET_DATE" ]; then DATE_ARG="--date $TARGET_DATE"; fi
          python -m nba.live_runtime $DATE_ARG --output runtime/live_run.json
          python -m nba.close_runtime --mode live
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-nba-runtime-${{ github.run_id }}
          path: runtime/
          if-no-files-found: ignore
          retention-days: 30
      - name: Persist runtime-data branch
        run: |
          if [ ! -d runtime ]; then exit 0; fi
          rm -rf /tmp/pulsar-runtime && cp -a runtime /tmp/pulsar-runtime
          git fetch origin runtime-data || true
          git checkout -B runtime-data origin/runtime-data
          rm -rf runtime && cp -a /tmp/pulsar-runtime runtime
          git config user.name "pulsar-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f runtime
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "runtime: prospective NBA evidence [skip ci]"
          git push origin runtime-data
