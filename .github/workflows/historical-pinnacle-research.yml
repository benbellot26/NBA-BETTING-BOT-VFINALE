name: Pulsar NBA Historical Pinnacle Research
concurrency:
  group: nba-runtime-data
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:
      max_snapshots:
        description: Maximum historical forecast snapshots to query
        required: false
        default: '4'
  schedule:
    - cron: '10 13 * * *'
permissions:
  contents: write
jobs:
  recover:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.NBA_HISTORICAL_PINNACLE_ENABLED == 'true' }}
    runs-on: ${{ vars.NBA_DATA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Hydrate runtime state
        run: .github/scripts/hydrate-runtime-data.sh
      - name: Recover historical Pinnacle entry benchmark
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MAX_SNAPSHOTS: ${{ inputs.max_snapshots }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "ODDS_API_KEY missing; historical Pinnacle recovery skipped."
            exit 0
          fi
          LIMIT="${MAX_SNAPSHOTS:-4}"
          python -m nba.historical_pinnacle_recovery --max-snapshots "$LIMIT"             | tee runtime/research/pinnacle_historical_recovery_status.json
      - name: Score recovered historical Pinnacle
        if: always()
        run: |
          if [ -f runtime/research/pinnacle_historical_entry.jsonl ]; then
            python -m nba.historical_pinnacle_performance
          fi
      - name: Refresh research readiness
        if: always()
        run: python -m nba.research_readiness --output runtime/research_readiness.json || true
      - name: Refresh health report
        if: always()
        run: python -m nba.health_report --output runtime/health.json || true
      - name: Upload historical Pinnacle research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-nba-historical-pinnacle-${{ github.run_id }}
          path: |
            runtime/research/pinnacle_historical_entry.jsonl
            runtime/research/pinnacle_historical_performance.json
            runtime/research/pinnacle_historical_recovery_status.json
            runtime/research_readiness.json
            runtime/odds_budget.json
            runtime/health.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Persist runtime state
        if: always()
        run: .github/scripts/persist-runtime-data.sh
