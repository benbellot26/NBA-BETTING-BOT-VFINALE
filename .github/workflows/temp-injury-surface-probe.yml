name: Temporary Injury Surface Probe
on:
  push:
    branches: [injury-report-resilience]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Probe official NBA injury discovery surfaces
        run: |
          python - <<'PY'
          import json
          from nba.provider_http import get_text, get_json
          urls = {
            "homepage": ("text", "https://official.nba.com/"),
            "known_2025_26": ("text", "https://official.nba.com/nba-injury-report-2025-26-season/"),
            "current_2026_27": ("text", "https://official.nba.com/nba-injury-report-2026-27-season/"),
            "search": ("text", "https://official.nba.com/?s=NBA%20Injury%20Report"),
            "wp_json_root": ("json", "https://official.nba.com/wp-json/"),
            "wp_search": ("json", "https://official.nba.com/wp-json/wp/v2/search?search=NBA%20Injury%20Report&per_page=10"),
            "wp_pages_slug": ("json", "https://official.nba.com/wp-json/wp/v2/pages?slug=nba-injury-report-2025-26-season"),
            "wp_sitemap": ("text", "https://official.nba.com/wp-sitemap.xml"),
            "legacy_sitemap": ("text", "https://official.nba.com/sitemap_index.xml"),
            "robots": ("text", "https://official.nba.com/robots.txt"),
          }
          out = {}
          for name, (kind, url) in urls.items():
            try:
              value = get_json(url, timeout=8.0, retries=0) if kind == "json" else get_text(url, headers={"Accept":"text/html,application/xml,text/plain,*/*"}, timeout=8.0, retries=0)
              text = json.dumps(value) if kind == "json" else value
              out[name] = {
                "ok": True,
                "size": len(text),
                "injury": "injury" in text.lower(),
                "report": "report" in text.lower(),
                "pdf": ".pdf" in text.lower(),
                "wp_json": "wp-json" in text.lower(),
              }
            except Exception as exc:
              out[name] = {"ok": False, "error": str(exc)}
          print(json.dumps(out, indent=2))
          for query in ("2026-27 NBA Injury Report", "2025-26 NBA Injury Report", "NBA Injury Report"):
            try:
              rows = get_json(
                "https://official.nba.com/wp-json/wp/v2/search?search="
                + query.replace(" ", "%20") + "&per_page=20",
                timeout=8.0, retries=0,
              )
              safe = [
                {
                  "id": row.get("id"),
                  "title": row.get("title"),
                  "url": row.get("url"),
                  "subtype": row.get("subtype"),
                }
                for row in rows
              ]
              print("SEARCH", query, json.dumps(safe, indent=2))
            except Exception as exc:
              print("SEARCH", query, "ERROR", exc)
          import re
          known_html = get_text(
            "https://official.nba.com/nba-injury-report-2025-26-season/",
            headers={"Accept":"text/html,*/*"}, timeout=8.0, retries=0,
          )
          hrefs = re.findall(r'href=["\\\']([^"\\\']+)["\\\']', known_html, flags=re.I)
          safe_hrefs = [
            href for href in hrefs
            if "injury" in href.lower() or ".pdf" in href.lower()
          ]
          print("INJURY_HREFS", json.dumps(safe_hrefs[-40:], indent=2))
          post_urls = {
            "post_by_id": "https://official.nba.com/wp-json/wp/v2/posts/16977",
            "post_by_slug": "https://official.nba.com/wp-json/wp/v2/posts?slug=nba-injury-report-2025-26-season",
          }
          for label, url in post_urls.items():
            try:
              payload = get_json(url, timeout=8.0, retries=0)
              raw = json.dumps(payload)
              print("POST", label, json.dumps({
                "ok": True,
                "size": len(raw),
                "injury": "injury" in raw.lower(),
                "pdf": ".pdf" in raw.lower(),
                "iframe": "iframe" in raw.lower(),
                "api": "api" in raw.lower(),
                "ajax": "ajax" in raw.lower(),
              }, indent=2))
              if isinstance(payload, dict):
                rendered = str((payload.get("content") or {}).get("rendered") or "")
              elif isinstance(payload, list) and payload:
                rendered = str((payload[0].get("content") or {}).get("rendered") or "")
              else:
                rendered = ""
              needles = ("injury", "iframe", "script", "api", "ajax", "report")
              compact = " ".join(rendered.split())
              contexts = []
              lower = compact.lower()
              for needle in needles:
                pos = 0
                while True:
                  hit = lower.find(needle, pos)
                  if hit < 0:
                    break
                  snippet = compact[max(0, hit-180):hit+400]
                  if snippet not in contexts:
                    contexts.append(snippet)
                  pos = hit + len(needle)
              print("POST_CONTEXTS", label, json.dumps(contexts[:20], indent=2))
            except Exception as exc:
              print("POST", label, "ERROR", exc)

          # Inspect same-origin script sources and HTML attributes mentioning
          # injury/report/API without persisting the full page.
          scripts = re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)["\\\']', known_html, flags=re.I)
          print("SCRIPT_SRCS", json.dumps(scripts[-40:], indent=2))
          compact_html = " ".join(known_html.split())
          lower_html = compact_html.lower()
          contexts = []
          pos = 0
          while True:
            hit = lower_html.find("injury", pos)
            if hit < 0:
              break
            contexts.append(compact_html[max(0, hit-220):hit+520])
            pos = hit + 6
          print("HTML_INJURY_CONTEXTS", json.dumps(contexts[:25], indent=2))

          from nba.injury_pdf import discover_injury_page_url
          print("DISCOVER_2025", discover_injury_page_url(season="2025-26"))
          try:
            print("DISCOVER_2026", discover_injury_page_url(season="2026-27"))
          except Exception as exc:
            print("CURRENT_EXPECTED", type(exc).__name__, str(exc))
          PY
