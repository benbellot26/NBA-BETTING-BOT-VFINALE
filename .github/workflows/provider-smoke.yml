name: Pulsar NBA Provider Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/provider_smoke.py'
      - '.github/workflows/provider-smoke.yml'
  schedule:
    - cron: '10 13 * * *'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Official-provider smoke
        run: python -m nba.provider_smoke
