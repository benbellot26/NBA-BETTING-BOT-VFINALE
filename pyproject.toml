[project]
name = "pulsar-nba"
version = "1.7.0"
description = "Pulsar NBA probability, research and decision engine"
requires-python = ">=3.12,<3.13"
dependencies = ["pypdf==6.19.0"]

[tool.setuptools]
packages = ["nba"]

[tool.pulsar]
model-generation = "pulsar-nba-v1-structural"
probability-policy = "pulsar-nba-probability-policy-v1"
runtime-dependency-policy = "stdlib-core; pinned-pypdf-acquisition"
