name: Pulsar NBA CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install .
      - name: Compile
        run: python -m py_compile nba/*.py
      - name: Preflight
        run: python -m nba.preflight
      - name: Unit tests
        run: python -m unittest discover -s tests -v
