name: Pulsar NBA Stats Route Transport
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/stats-route-transport-2026-09-28.flag'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Hydrate runtime state
        run: .github/scripts/hydrate-runtime-data.sh
      - name: Probe official NBA stats candidate routes
        run: python -m nba.stats_route_transport_probe --output runtime/stats_route_transport_probe.json
      - name: Refresh research readiness
        if: always()
        run: python -m nba.research_readiness --output runtime/research_readiness.json || true
      - name: Refresh health report
        if: always()
        run: python -m nba.health_report --output runtime/health.json || true
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-nba-stats-route-transport-${{ github.run_id }}
          path: |
            runtime/stats_route_transport_probe.json
            runtime/research_readiness.json
            runtime/health.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Persist runtime state
        if: always()
        run: .github/scripts/persist-runtime-data.sh
