name: Pulsar NBA Live Research
concurrency:
  group: nba-runtime-data
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: YYYY-MM-DD (optional)
        required: false
      operating_mode:
        description: Safe manual rehearsal mode. Regular still requires NBA_LIVE_ENABLED.
        type: choice
        options:
          - preseason
          - regular
        required: true
        default: preseason
  schedule:
    - cron: '*/20 17-23 * * *'
    - cron: '*/20 0-6 * * *'
jobs:
  live:
    if: ${{ vars.NBA_LIVE_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.operating_mode == 'preseason') }}
    runs-on: ${{ vars.NBA_DATA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Hydrate runtime evidence
        run: .github/scripts/hydrate-runtime-data.sh
      - name: Run live research and close capture
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TARGET_DATE: ${{ inputs.target_date }}
          OPERATING_MODE: ${{ inputs.operating_mode }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "ODDS_API_KEY is not configured; live research skipped."
            exit 0
          fi
          DATE_ARG=""
          if [ -n "$TARGET_DATE" ]; then DATE_ARG="--date $TARGET_DATE"; fi
          MODE="${OPERATING_MODE:-regular}"
          if [ "$MODE" = "regular" ] && [ "${{ vars.NBA_LIVE_ENABLED }}" != "true" ]; then
            echo "Regular research requires NBA_LIVE_ENABLED=true."
            exit 1
          fi
          if [ "$MODE" = "preseason" ]; then
            python -m nba.provider_smoke --output runtime/provider_smoke.json
          fi
          python -m nba.live_runtime $DATE_ARG --mode "$MODE" --output runtime/live_run.json
          if [ "$MODE" = "regular" ]; then python -m nba.close_runtime --mode live; fi
      - name: Refresh health report
        if: always()
        run: python -m nba.health_report || true
      - name: Operational alert gate
        if: always()
        run: |
          if [ -f runtime/health.json ]; then python -m nba.health_gate; fi
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-nba-runtime-${{ github.run_id }}
          path: runtime/
          if-no-files-found: ignore
          retention-days: 30
      - name: Persist runtime-data branch
        if: always()
        run: .github/scripts/persist-runtime-data.sh
