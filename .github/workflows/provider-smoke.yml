name: Pulsar NBA Provider Smoke
concurrency:
  group: nba-runtime-data
  cancel-in-progress: false
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/provider_smoke.py'
      - 'nba/provider_http.py'
      - 'nba/communications_schedule.py'
      - 'nba/runner_probe.py'
      - 'nba/stats_page_probe.py'
      - 'nba/nextdata_probe.py'
      - '.github/workflows/provider-smoke.yml'
  schedule:
    - cron: '10 13 * * *'
jobs:
  smoke:
    runs-on: ${{ vars.NBA_DATA_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Hydrate runtime state
        run: .github/scripts/hydrate-runtime-data.sh
      - name: Runner network probe
        if: always()
        run: python -m nba.runner_probe --output runtime/runner_probe.json
      - name: Inspect reachable www NBA stats pages
        if: always()
        run: python -m nba.stats_page_probe --output runtime/www_stats_probe.json
      - name: Inspect NBA stats __NEXT_DATA__ structure
        if: always()
        run: python -m nba.nextdata_probe --output runtime/www_nextdata_probe.json
      - name: Official-provider smoke
        run: python -m nba.provider_smoke --output runtime/provider_smoke.json
      - name: Refresh readiness snapshot
        if: always()
        run: python -m nba.readiness_gate --output runtime/readiness_gate.json || true
      - name: Refresh health snapshot
        if: always()
        run: python -m nba.health_report --output runtime/health.json || true
      - name: Upload provider diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-nba-provider-smoke-${{ github.run_id }}
          path: |
            runtime/provider_smoke.json
            runtime/runner_probe.json
            runtime/www_stats_probe.json
            runtime/www_nextdata_probe.json
            runtime/readiness_gate.json
            runtime/health.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Persist provider diagnostics
        if: always()
        run: .github/scripts/persist-runtime-data.sh
