name: Pulsar NBA Live Research

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: YYYY-MM-DD (optional)
        required: false
  schedule:
    - cron: '17 * * * *'

jobs:
  live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Run live research
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "ODDS_API_KEY is not configured; live research skipped."
            exit 0
          fi
          DATE_ARG=""
          if [ -n "$TARGET_DATE" ]; then DATE_ARG="--date $TARGET_DATE"; fi
          python -m nba.live_runtime $DATE_ARG --output runtime/live_run.json
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-nba-runtime-${{ github.run_id }}
          path: runtime/
          if-no-files-found: ignore
          retention-days: 30
