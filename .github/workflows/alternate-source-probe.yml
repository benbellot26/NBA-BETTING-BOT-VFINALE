name: Pulsar NBA Alternate Source Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/alternate_probe.py'
      - '.github/workflows/alternate-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check independent scoreboard and boxscore accessibility
        run: python -m nba.alternate_probe
