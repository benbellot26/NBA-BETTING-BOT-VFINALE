name: Pulsar NBA One-Click Preseason Validation
concurrency:
  group: nba-runtime-data
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: NBA date YYYY-MM-DD (optional)
        required: false
  push:
    branches: [main]
    paths:
      - 'ops/preseason-validation-refresh-2026-09-24.flag'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ${{ vars.NBA_DATA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Hydrate persisted runtime state
        run: .github/scripts/hydrate-runtime-data.sh
      - name: One-click fail-closed preseason validation
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          DATE_ARG=""
          if [ -n "$TARGET_DATE" ]; then DATE_ARG="--date $TARGET_DATE"; fi
          python -m nba.preseason_ops $DATE_ARG --output runtime/preseason_validation.json
      - name: Refresh health snapshot
        if: always()
        run: python -m nba.health_report --output runtime/health.json || true
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-nba-preseason-validation-${{ github.run_id }}
          path: |
            runtime/preseason_validation.json
            runtime/provider_smoke.json
            runtime/market_smoke.json
            runtime/preseason_live_run.json
            runtime/health.json
            runtime/odds_budget.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Persist runtime diagnostics
        if: always()
        run: .github/scripts/persist-runtime-data.sh
