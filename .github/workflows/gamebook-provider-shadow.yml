name: Pulsar NBA Gamebook Provider Shadow
concurrency:
  group: nba-runtime-data
  cancel-in-progress: false
on:
  workflow_run:
    workflows: ["Pulsar NBA Gamebook Reference"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_date:
        description: YYYY-MM-DD (optional)
        required: false
  schedule:
    - cron: '*/20 16-23 * 1-6,10-12 *'
    - cron: '*/20 0-7 * 1-6,10-12 *'
permissions:
  contents: write
jobs:
  shadow:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ vars.NBA_DATA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Hydrate runtime state
        run: .github/scripts/hydrate-runtime-data.sh
      - name: Record gamebook provider shadow
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          DATE_ARG=""
          if [ -n "$TARGET_DATE" ]; then DATE_ARG="--date $TARGET_DATE"; fi
          python -m nba.gamebook_shadow_runtime $DATE_ARG
      - name: Refresh resolved shadow performance
        if: always()
        run: python -m nba.gamebook_shadow_performance || true
      - name: Assess manual provider-review readiness
        if: always()
        run: |
          if [ -f runtime/provider_shadow/performance.json ]; then
            python -m nba.gamebook_shadow_gate
          fi
      - name: Refresh research readiness
        if: always()
        run: python -m nba.research_readiness --output runtime/research_readiness.json || true
      - name: Refresh health report
        if: always()
        run: python -m nba.health_report --output runtime/health.json || true
      - name: Upload provider shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-nba-gamebook-provider-shadow-${{ github.run_id }}
          path: |
            runtime/provider_shadow/
            runtime/gamebook_reference/
            runtime/health.json
            runtime/research_readiness.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Persist runtime-data branch
        if: always()
        run: .github/scripts/persist-runtime-data.sh
