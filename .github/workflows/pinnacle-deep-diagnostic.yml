name: Pulsar NBA Pinnacle Deep Diagnostic
concurrency:
  group: nba-runtime-data
  cancel-in-progress: false
on:
  push:
    branches: [main]
    paths:
      - 'ops/pinnacle-preseason-probe-2026-09-28.flag'
  workflow_dispatch:
    inputs:
      sport_key:
        description: Odds API NBA sport key
        type: choice
        options:
          - basketball_nba
          - basketball_nba_preseason
        required: true
        default: basketball_nba
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Hydrate runtime state
        run: .github/scripts/hydrate-runtime-data.sh
      - name: Compare targeted Pinnacle with EU region
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORT_KEY: ${{ inputs.sport_key || 'basketball_nba_preseason' }}
        run: |
          python -m nba.pinnacle_transport_probe \
            --sport-key "$SPORT_KEY" \
            --output runtime/pinnacle_transport_probe.json
      - name: Refresh health snapshot
        if: always()
        run: python -m nba.health_report --output runtime/health.json || true
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-nba-pinnacle-diagnostic-${{ github.run_id }}
          path: |
            runtime/pinnacle_transport_probe.json
            runtime/health.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Persist diagnostic
        if: always()
        run: .github/scripts/persist-runtime-data.sh
