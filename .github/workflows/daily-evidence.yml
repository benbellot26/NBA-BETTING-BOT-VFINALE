name: Pulsar NBA Daily Evidence
concurrency:
  group: nba-runtime-data
  cancel-in-progress: false
on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *'
jobs:
  evidence:
    if: ${{ vars.NBA_LIVE_ENABLED == 'true' }}
    runs-on: ${{ vars.NBA_DATA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Hydrate runtime evidence
        run: .github/scripts/hydrate-runtime-data.sh
      - name: Settle and refresh evidence
        run: python -m nba.performance_runtime
      - name: Verify prospective evidence integrity
        run: python -m nba.evidence_audit
      - name: Refresh health report
        if: always()
        run: python -m nba.health_report || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-nba-evidence-${{ github.run_id }}
          path: runtime/
          if-no-files-found: ignore
          retention-days: 90
      - name: Persist runtime-data branch
        if: always()
        run: .github/scripts/persist-runtime-data.sh
