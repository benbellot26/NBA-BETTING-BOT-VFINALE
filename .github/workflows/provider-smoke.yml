name: Pulsar NBA Provider Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/provider_smoke.py'
      - 'nba/provider_http.py'
      - '.github/workflows/provider-smoke.yml'
  schedule:
    - cron: '10 13 * * 3'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Official-provider smoke
        run: python -m nba.provider_smoke --output runtime/provider_smoke.json
      - name: Upload provider diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-nba-provider-smoke-${{ github.run_id }}
          path: runtime/provider_smoke.json
          if-no-files-found: ignore
          retention-days: 30
