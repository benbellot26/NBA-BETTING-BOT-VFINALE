name: Temporary Gamebook Parser Probe
on:
  push:
    branches: [provider-gamebook-fallback]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Validate known official NBA gamebooks
        run: |
          python -m nba.official_report_probe --output /tmp/gamebook-probe.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/gamebook-probe.json'))
          print(json.dumps(p, indent=2))
          assert p["official_gamebook_candidate"] is True, p
          assert p["gamebook_samples_ok"] == p["gamebook_samples_total"] == 3, p
          PY
