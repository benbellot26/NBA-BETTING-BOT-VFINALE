name: Pulsar NBA Daily Evidence
concurrency:
  group: nba-runtime-data
  cancel-in-progress: false
on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *'
jobs:
  evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Hydrate runtime evidence
        run: |
          git fetch origin runtime-data || true
          if git show-ref --verify --quiet refs/remotes/origin/runtime-data; then
            git archive origin/runtime-data runtime 2>/dev/null | tar -x || true
          fi
      - name: Settle and refresh evidence
        run: python -m nba.performance_runtime
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-nba-evidence-${{ github.run_id }}
          path: runtime/evidence/
          if-no-files-found: ignore
          retention-days: 90
      - name: Persist runtime-data branch
        run: |
          if [ ! -d runtime ]; then exit 0; fi
          rm -rf /tmp/pulsar-runtime && cp -a runtime /tmp/pulsar-runtime
          git fetch origin runtime-data || true
          git checkout -B runtime-data origin/runtime-data
          rm -rf runtime && cp -a /tmp/pulsar-runtime runtime
          git config user.name "pulsar-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f runtime
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "runtime: settle NBA paper evidence [skip ci]"
          git push origin runtime-data
